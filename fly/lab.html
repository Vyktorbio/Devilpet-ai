<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevilPet — Laboratório 3D experimental</title>
<style>html,body{margin:0;height:100%;background:#090b13;color:#e8ebff;font:14px system-ui}#view{position:fixed;inset:0}#hud{position:fixed;top:12px;left:12px;max-width:340px;background:#111827e8;border:1px solid #344055;border-radius:14px;padding:14px;line-height:1.65}button{background:#293c60;color:white;border:1px solid #536888;padding:8px;border-radius:8px;margin:3px;cursor:pointer}small{color:#adb7ce}#error{color:#ff9d9d}</style>
</head><body><div id="view"></div><section id="hud"><b>DevilPet · laboratório experimental 3D</b><div id="telemetry">Iniciando…</div><div><button id="toggle">Pausar</button><button id="reset">Reiniciar</button><button id="save">Salvar memória</button><button id="load">Restaurar</button></div><small>Movimento autônomo: fome, repouso, exploração e fuga. Cérebro heurístico experimental, não conectoma biológico. Não altera o jogo estável.</small><div id="error"></div></section>
<script src="../environment/world-state.js"></script><script src="./sensors.js"></script><script src="./behavior.js"></script><script src="./body.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const el=document.getElementById('telemetry'),err=document.getElementById('error');
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a1020);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);camera.position.set(0,21,22);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('view').append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x243047,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,15,8);scene.add(light);
const floor=new THREE.Mesh(new THREE.CircleGeometry(15,96),new THREE.MeshStandardMaterial({color:0x26364a,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const rim=new THREE.Mesh(new THREE.TorusGeometry(15,.1,8,96),new THREE.MeshBasicMaterial({color:0x8a96b6}));rim.rotation.x=Math.PI/2;scene.add(rim);
const fly=new THREE.Group();const bodyMesh=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),new THREE.MeshStandardMaterial({color:0x8e8a72}));bodyMesh.scale.set(1.3,.55,.65);fly.add(bodyMesh);
for(const side of [-1,1]){const wing=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),new THREE.MeshStandardMaterial({color:0xb3e2ff,transparent:true,opacity:.65}));wing.scale.set(1.2,.13,.65);wing.position.set(-.08,.17,side*.25);fly.add(wing);}
scene.add(fly);
const fruits=[{x:5,z:2,odor:1,food:1,identity:'banana',color:0xffd45b},{x:-6,z:-4,odor:1,food:1,identity:'citrus',color:0xf8844d},{x:1,z:-7,odor:.7,food:1,identity:'berry',color:0xd866ae}];
for(const f of fruits){const mesh=new THREE.Mesh(new THREE.SphereGeometry(.65,18,12),new THREE.MeshStandardMaterial({color:f.color}));mesh.position.set(f.x,.6,f.z);scene.add(mesh);}
let controller,body,vitals,steps,contacts,lastContact,paused=false,acc=0,prev=performance.now();
function restart(){controller=new DevilPetBehavior.FlyBehavior({seed:37});body=new DevilPetBody.FlyBody({radius:15});vitals={energy:.7,rest:.9,curiosity:.8,bond:.2};steps=0;contacts=0;lastContact=false;for(const f of fruits)f.food=1;}
restart();
function tick(dt){
const world=DevilPetWorldState.snapshot({radius:15,fruits,ambientLight:.85});
const frame=DevilPetSensors.sample(world,body.pose,vitals,{localHour:12});
const contact=!!frame.taste.food;
const motor=controller.step(frame,{dt,reward:contact&&!lastContact?1:0});
body.step(motor,dt);
if(contact&&!lastContact){contacts++;vitals.energy=Math.min(1,vitals.energy+.24);for(const f of fruits)if(Math.hypot(f.x-body.pose.x,f.z-body.pose.z)<1.25)f.food=Math.max(.05,f.food-.12);}
lastContact=contact;
const active=motor.mode!=='rest';vitals.energy=Math.max(.05,vitals.energy-(active?.0012:.0002));vitals.rest=Math.max(0,Math.min(1,vitals.rest+(active?-.0018:.007)));vitals.curiosity=Math.max(.15,Math.min(.95,vitals.curiosity+(motor.mode==='explore'?-.0004:.0003)));
steps++;
fly.position.set(body.pose.x,body.pose.y,body.pose.z);fly.rotation.y=-body.pose.angle;
if(steps%10===0)el.textContent='Modo: '+motor.mode+' | Energia: '+Math.round(vitals.energy*100)+'% | Descanso: '+Math.round(vitals.rest*100)+'% | Contatos: '+contacts+' | Passos: '+steps+' | Memórias: '+controller.values.size+' | Colisões: '+body.collisions;
}
function animate(now){requestAnimationFrame(animate);const delta=Math.min(.15,(now-prev)/1000);prev=now;if(!paused){acc+=delta;let n=0;while(acc>=.05&&n++<4){tick(.05);acc-=.05;}}renderer.render(scene,camera);}
requestAnimationFrame(animate);
document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Retomar':'Pausar';};
document.getElementById('reset').onclick=restart;
document.getElementById('save').onclick=()=>{try{localStorage.setItem('devilpet-lab-v1',JSON.stringify(controller.snapshot()));err.textContent='Memória salva neste navegador.';}catch(e){err.textContent=e.message;}};
document.getElementById('load').onclick=()=>{try{const data=localStorage.getItem('devilpet-lab-v1');if(!data)throw Error('Nenhuma memória salva.');controller.restore(JSON.parse(data));err.textContent='Memória restaurada.';}catch(e){err.textContent=e.message;}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}catch(e){err.textContent='Falha ao iniciar laboratório: '+e.message;console.error(e);}
</script></body></html>
