name: Build and publish Rust WASM DevilPet

on:
  pull_request:
    paths:
      - "index.html"
      - "vendor/**"
      - "fly/**"
      - "environment/**"
      - "wasm-activate.js"
      - "rust/devilpet_brain/**"
      - ".github/workflows/rust-wasm-pages.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "vendor/**"
      - "fly/**"
      - "environment/**"
      - "wasm-activate.js"
      - "rust/devilpet_brain/**"
      - ".github/workflows/rust-wasm-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "rust-wasm-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Run native reference tests and WASM build
        run: |
          cd rust/devilpet_brain
          cargo test --all-targets
          wasm-pack build --release --target web --out-dir pkg
          test -s pkg/devilpet_brain.js
          test -s pkg/devilpet_brain_bg.wasm
          node -e 'const fs=require("fs"); WebAssembly.compile(fs.readFileSync("pkg/devilpet_brain_bg.wasm")).then(()=>console.log("WebAssembly binary compiles")).catch(e=>{console.error(e); process.exit(1)})'
      - name: Smoke-test live Rust WASM execution, reinforcement and portable state
        run: |
          cd rust/devilpet_brain/pkg
          cp devilpet_brain.js devilpet_brain.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import init, { WasmSparseBrain, WasmOdorBrain } from './devilpet_brain.mjs';
          const bytes=fs.readFileSync('./devilpet_brain_bg.wasm');
          await init({module_or_path:bytes});
          for(const tier of ['drosophila','expanded','bee','super']){
            const brain=new WasmSparseBrain(tier,42);
            const baseline=brain.get_short_weights();
            assert.equal(baseline.every(x=>x===0),true);
            const output=brain.step(.75,.05,.1,.4,.5,1,.02,true,15);
            assert.ok(Array.isArray(output.mbonApproach));
            assert.ok(Number.isFinite(output.sparsityPct));
            assert.equal(brain.get_tick(),60);
            assert.ok(brain.get_short_weights().some(x=>x!==0));
            const snap=brain.full_snapshot_json();
            const replay=new WasmSparseBrain(tier,99);
            replay.restore_full_json(snap);
            assert.equal(replay.get_rng_state(),brain.get_rng_state());
            const a=brain.step(.4,.2,.3,.1,.8,0,.85,true,15);
            const b=replay.step(.4,.2,.3,.1,.8,0,.85,true,15);
            assert.equal(a.dnSpikes,b.dnSpikes);
            brain.reset_weights();
            assert.equal(brain.get_short_weights().every(x=>x===0),true);
          }
          const odor=new WasmOdorBrain(47);
          const choice=odor.choose(.5,.5,.5,.5,.5,.8,.6);
          assert.ok(['alimentar','explorar','repousar','brincar'].includes(choice.activity));
          odor.reinforce(0,1);
          assert.equal(odor.get_rewards(),1);
          const state=odor.snapshot_json();
          const restored=new WasmOdorBrain(47);
          restored.restore_json(state);
          assert.equal(restored.get_rewards(),1);
          assert.ok(restored.odor_value(0)>0);
          console.log('Rust WASM: both circuits execute and memories roundtrip.');
          NODE
      - name: Integration test opt-in engine and automatic JS fallback
        run: |
          cd rust/devilpet_brain/pkg
          node ../tests/runtime-smoke.mjs
      - name: Install pinned, local rendering assets and browser smoke runner
        run: |
          npm install --no-save --no-audit --no-fund --package-lock=false playwright-core@1.56.1
      - name: Run independent sensory-organ and whole-CNS protocol unit tests
        run: |
          node fly/sensors.test.cjs
          node fly/connectome-bridge.test.cjs
          node fly/headless-demo.cjs > /tmp/devilpet-headless-result.json
      - name: Regression test branch-based GitHub Pages on mobile viewport
        run: |
          # Crucial: the branch publisher may serve the checked-out repository
          # directly, without compiled WASM. All required scene assets must be present.
          python3 -m http.server 8138 --bind 127.0.0.1 --directory . >/tmp/devilpet-branch-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          node rust/devilpet_brain/tests/branch-pages-smoke.mjs
      - name: Create standalone Pages artifact
        run: |
          mkdir -p _site/rust/devilpet_brain/pkg _site/vendor _site/connectomes _site/fly _site/environment
          cp index.html ./*.js _site/
          cp vendor/three.min.js _site/vendor/three.min.js
          cp vendor/LICENSE-three.txt _site/vendor/LICENSE-three.txt
          cp connectomes/index.html connectomes/datasets.json _site/connectomes/
          cp fly/*.js _site/fly/
          cp environment/*.js _site/environment/
          cp rust/devilpet_brain/pkg/devilpet_brain.js _site/rust/devilpet_brain/pkg/
          cp rust/devilpet_brain/pkg/devilpet_brain_bg.wasm _site/rust/devilpet_brain/pkg/
          touch _site/.nojekyll
          test -s _site/neural-engine.js
          test -s _site/wasm-activate.js
          test -s _site/rust/devilpet_brain/pkg/devilpet_brain_bg.wasm
          test -s _site/connectomes/index.html
          test -s _site/connectomes/datasets.json
          test -s _site/fly/agent.js
          test -s _site/fly/sensors.js
          test -s _site/fly/connectome-bridge.js
          test -s _site/environment/world3d.js
          test -s _site/environment/habitat3d.js
          test -s _site/vendor/three.min.js
      - name: Browser smoke test including 3D rendering and JS/Rust fallback
        run: |
          python3 -m http.server 8137 --bind 127.0.0.1 --directory _site >/tmp/devilpet-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          node rust/devilpet_brain/tests/browser-smoke.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload WASM for pull request inspection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: devilpet-rust-wasm
          path: |
            rust/devilpet_brain/pkg/devilpet_brain.js
            rust/devilpet_brain/pkg/devilpet_brain_bg.wasm
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public game with Rust engine
        id: deployment
        uses: actions/deploy-pages@v4
