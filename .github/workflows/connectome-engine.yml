name: Python complete connectome graph and neuronal ports

on:
  pull_request:
    paths:
      - "python/**"
      - "connectomes/**"
      - ".github/workflows/connectome-engine.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "connectomes/**"
      - ".github/workflows/connectome-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python scientific dependencies (no Rust)
        run: python -m pip install "numpy>=1.26,<3" "pyarrow>=18,<26"
      - name: Verify CSV, Arrow Feather and Parquet converter
        run: python -m unittest discover -s connectomes/tests -v
      - name: Verify Python graph, original IDs, reviewed ports and HTTP CNS controller
        run: python -m unittest discover -s python/tests -v
      - name: End-to-end on explicit synthetic CSR fixture (not official connectome)
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          printf 'body_pre,body_post,weight\n101,202,1000\n202,303,1000\n101,303,2\n' > "$work/edges.csv"
          python connectomes/import_graph.py --edges "$work/edges.csv" \
            --pre body_pre --post body_post --weight weight \
            --dataset synthetic-fixture --version v1 \
            --source synthetic://ci --license test-only \
            --out "$work/graph" --batch-size 10
          python python/connectome_cli.py inspect "$work/graph"
          python python/connectome_cli.py neighbors "$work/graph" 101 --top 5
          cat > "$work/ports.json" <<'JSON'
          {
            "format":"devilpet-connectome-ports-v1",
            "dataset_id":"synthetic-fixture","version":"v1",
            "annotation_source":"synthetic://ci",
            "reviewed_by":"synthetic-ci-fixture",
            "reviewed_at":"2026-11-20",
            "sensors":{"odor_left":[{"body_id":101,"annotation":"test sensor","evidence":"synthetic test only"}]},
            "motors":{
              "forward":[{"body_id":202,"annotation":"test motor","evidence":"synthetic test only"}],
              "turn_left":[{"body_id":202,"annotation":"test motor","evidence":"synthetic test only"}],
              "turn_right":[{"body_id":303,"annotation":"test motor","evidence":"synthetic test only"}],
              "lift":[{"body_id":303,"annotation":"test motor","evidence":"synthetic test only"}]
            }
          }
          JSON
          python python/connectome_cli.py pulse "$work/graph" "$work/ports.json" --hops 2

  official-annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arrow reader
        run: python -m pip install "pyarrow>=18,<26"
      - name: Download official 2026 Male CNS neuron annotations, not simulated data
        run: |
          mkdir -p /tmp/devilpet-cns data-review
          curl --fail --location --retry 3 --max-time 240 \
            "https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather" \
            -o /tmp/devilpet-cns/male-annotations.feather
          test -s /tmp/devilpet-cns/male-annotations.feather
          python connectomes/extract_ports.py \
            --annotations /tmp/devilpet-cns/male-annotations.feather \
            --out data-review/male-cns-candidates.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data-review/male-cns-candidates.provenance.json").read_text())
          assert p["counts"]["total_rows"]>150000
          assert p["counts"]["candidate_sensory"]>0
          assert p["counts"]["candidate_motor"]>0
          print("OFFICIAL MALE CNS ANNOTATIONS AUDITED",p["counts"])
          print("This does NOT assign motor directions or activate the real CNS.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: male-cns-2026-real-neuron-candidates
          path: data-review/
          retention-days: 14
