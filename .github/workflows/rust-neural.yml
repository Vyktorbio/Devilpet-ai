name: Rust neural engine validation
on:
  pull_request:
    paths:
      - "rust/devilpet_brain/**"
      - ".github/workflows/rust-neural.yml"
  push:
    branches: [main]
    paths:
      - "rust/devilpet_brain/**"
      - ".github/workflows/rust-neural.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-neural:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/devilpet_brain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test reduced neural model against JavaScript golden vectors
        run: cargo test --all-targets --verbose
