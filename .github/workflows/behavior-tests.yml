name: Experimental fly behavior tests
on:
  push:
    branches:
      - feature/fly-perception-drives-memory-v1
  pull_request:
    paths:
      - 'fly/behavior.js'
      - 'fly/behavior.test.cjs'
      - 'fly/sensors.js'
      - '.github/workflows/behavior-tests.yml'
  workflow_dispatch:
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check behavior syntax
        run: node --check fly/behavior.js
      - name: Check sensor syntax
        run: node --check fly/sensors.js
      - name: Run behavior tests
        run: node fly/behavior.test.cjs
