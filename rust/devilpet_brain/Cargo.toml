[package]
name = "devilpet_brain"
version = "0.1.0"
edition = "2021"
description = "Headless, portable Rust port of DevilPet AI's reduced neural engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "devilpet-reference"
path = "src/bin/reference.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
