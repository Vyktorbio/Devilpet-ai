[package]
name = "devilpet_connectome"
version = "0.1.0"
edition = "2021"
description = "Sparse read-only connectome graph engine for versioned real Drosophila CNS datasets"

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[[bin]]
name = "connectome-cli"
path = "src/main.rs"
